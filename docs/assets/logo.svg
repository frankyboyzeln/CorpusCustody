<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d" width="240" height="240">
  <!--
    Palette reason: the subject is custody of a corpus, a gate that either lets a
    set through or holds it. Slate (#334155) is the neutral body of the wordmark.
    The single accent, amber (#b45309), marks the "custody" morpheme: the part
    that decides. Two colours plus neutrals, accent used in exactly one place.
    No gradient, no glow, flat fills only.
    Mark: a literal 3-record gate. Three record blocks feed one gate bar; the
    gate is drawn open (a gap) to show it is a pass/hold decision point.
  -->
  <title id="t">corpuscustody wordmark</title>
  <desc id="d">The name corpuscustody with the custody half in amber, above a mark of three record blocks passing through a gate bar.</desc>
  <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>

  <!-- Mark: three record blocks on the left, a gate bar they pass through -->
  <g>
    <rect x="40" y="60" width="24" height="16" rx="3" fill="#334155"/>
    <rect x="40" y="84" width="24" height="16" rx="3" fill="#334155"/>
    <rect x="40" y="108" width="24" height="16" rx="3" fill="#334155"/>
    <!-- connectors from blocks to the gate -->
